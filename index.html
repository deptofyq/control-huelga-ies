<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Inspección de Huelga - IES Neil Armstrong</title>
    <!-- Tailwind CSS para un diseño limpio, profesional y responsive -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- Header institucional -->
    <header class="bg-blue-900 text-white shadow-md py-4 px-6">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center">
            <div>
                <h1 class="text-xl font-bold">I.E.S. Neil Armstrong (Valdemoro)</h1>
                <p class="text-sm text-blue-200">Jefatura de Estudios - Control de Seguimiento de Huelga</p>
            </div>
            <div id="reloj" class="mt-2 sm:mt-0 text-sm bg-blue-800 px-3 py-1 rounded-md font-mono"></div>
        </div>
    </header>

    <!-- Contenido Principal / Formulario -->
    <main class="max-w-3xl mx-auto w-full p-4 sm:p-6 my-6 bg-white rounded-xl shadow-lg border border-slate-100">
        <form id="formInspeccion" class="space-y-6">
            
            <!-- Selección de Profesor -->
            <div>
                <label for="profesorSelect" class="block text-sm font-semibold text-slate-700 mb-1">Profesor / Profesora:</label>
                <select id="profesorSelect" required class="w-full rounded-lg border border-slate-300 p-3 bg-white focus:ring-2 focus:ring-blue-600 focus:outline-none transition">
                    <option value="" disabled selected>-- Seleccione o busque el docente --</option>
                </select>
            </div>

            <!-- Información automática de Horario y Situación Teórica -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-slate-50 p-4 rounded-lg border border-slate-200">
                <div>
                    <span class="block text-xs font-bold text-slate-500 uppercase">Aula / Espacio Asignado (Teórico):</span>
                    <input type="text" id="aulaTeorica" readonly class="w-full mt-1 bg-transparent font-medium text-slate-800 border-none p-0 focus:ring-0" placeholder="Se autocompletará...">
                </div>
                <div>
                    <span class="block text-xs font-bold text-slate-500 uppercase">Situación Teórica Prevista:</span>
                    <input type="text" id="situacionTeorica" readonly class="w-full mt-1 bg-transparent font-medium text-blue-700 border-none p-0 focus:ring-0" placeholder="Calculando según horario...">
                </div>
            </div>

            <!-- Fecha y Hora de la Inspección Visual -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="fechaInsp" class="block text-sm font-semibold text-slate-700 mb-1">Fecha de Inspección:</label>
                    <input type="date" id="fechaInsp" required class="w-full rounded-lg border border-slate-300 p-3 focus:ring-2 focus:ring-blue-600 focus:outline-none">
                </div>
                <div>
                    <label for="horaInsp" class="block text-sm font-semibold text-slate-700 mb-1">Franja / Hora:</label>
                    <input type="time" id="horaInsp" required class="w-full rounded-lg border border-slate-300 p-3 focus:ring-2 focus:ring-blue-600 focus:outline-none">
                </div>
            </div>

            <!-- Aula o Lugar de Permanencia Real Observado -->
            <div>
                <label for="aulaReal" class="block text-sm font-semibold text-slate-700 mb-1">Aula o Lugar de Permanencia Observado:</label>
                <input type="text" id="aulaReal" required placeholder="Ej: P0-09, Biblioteca, Sala de Profesores..." class="w-full rounded-lg border border-slate-300 p-3 focus:ring-2 focus:ring-blue-600 focus:outline-none">
            </div>

            <!-- Confirmar Presencia -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Confirmar Presencia:</label>
                <div class="flex gap-4 mt-2">
                    <label class="flex items-center space-x-2 cursor-pointer bg-emerald-50 px-4 py-2 rounded-lg border border-emerald-200 flex-1 justify-center">
                        <input type="radio" name="presencia" value="Presente" required class="text-emerald-600 focus:ring-emerald-500">
                        <span class="font-medium text-emerald-900">Presente</span>
                    </label>
                    <label class="flex items-center space-x-2 cursor-pointer bg-rose-50 px-4 py-2 rounded-lg border border-rose-200 flex-1 justify-center">
                        <input type="radio" name="presencia" value="Ausente" required class="text-rose-600 focus:ring-rose-500">
                        <span class="font-medium text-rose-900">Ausente</span>
                    </label>
                </div>
            </div>

            <!-- Situación Registrada (Clasificación Oficial para el Excel) -->
            <div>
                <label for="situacionFinal" class="block text-sm font-semibold text-slate-700 mb-1">Situación Oficial Registrada:</label>
                <select id="situacionFinal" required class="w-full rounded-lg border border-slate-300 p-3 bg-white focus:ring-2 focus:ring-blue-600 focus:outline-none">
                    <option value="" disabled selected>-- Seleccione estado definitivo --</option>
                    <option value="Profesores en aulas con alumnos dando clase">Profesores en aulas con alumnos dando clase</option>
                    <option value="Profesores en el centro educativo con otras tareas u horas complementarias">Profesores en el centro educativo con otras tareas u horas complementarias de su horario</option>
                    <option value="Profesores designados para servicios mínimos">Profesores designados para servicios mínimos</option>
                    <option value="Profesores que no están en el centro por causas ajenas a la huelga">Profesores que no están en el centro por causas ajenas a la huelga (baja, permisos...)</option>
                    <option value="Profesor en huelga">Profesor en huelga por no estar en el centro educativo debiendo estar según su horario y sin exención</option>
                </select>
            </div>

            <!-- Botón de Envío -->
            <button type="submit" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-semibold py-3 px-6 rounded-lg shadow transition duration-200">
                Registrar e Insertar en Hoja de Cálculo
            </button>
        </form>

        <div id="mensajeExito" class="hidden mt-4 p-4 bg-emerald-100 border border-emerald-300 text-emerald-800 rounded-lg text-center font-medium">
            ¡Registro guardado correctamente en la hoja de cálculo de EducaMadrid!
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-slate-500 border-t border-slate-200">
        Plataforma de Control Interno - IES Neil Armstrong &copy; 2026
    </th></footer>

    <!-- Lógica JavaScript para la aplicación -->
    <script>
        // Actualizar reloj en tiempo real
        function actualizarReloj() {
            const ahora = new Date();
            document.getElementById('reloj').innerText = ahora.toLocaleDateString() + ' ' + ahora.toLocaleTimeString();
            document.getElementById('fechaInsp').valueAsDate = ahora;
            document.getElementById('horaInsp').value = ahora.toTimeString().substring(0,5);
        }
        setInterval(actualizarReloj, 1000);
        actualizarReloj();

        // Lista oficial de profesores extraída de los documentos del centro
        const profesores = [
            "Águila Ortega, Manuel", "Alarcón García, Elena", "Alarcón García, Marta", "Alba Expósito, Mar", 
            "Alonso Ambrona, Beatriz", "Asenjo López, Laura", "Bermejo Salinero, Silvia", "Bernaldo de Quirós S., Marta", 
            "Blasco Benito, María José", "Blázquez, Carolina Alicia", "Boullosa Martínez, Luis José", "Buján Portela, Adrián", 
            "Caballero Begines, María", "Caballero Martínez, Tania", "Calderón Tena, Manuel", "Cáliz Cañizares, Nerea", 
            "Campo Tomé, María Gloria", "Campos Ortega, David", "Candilejo Peña, Vanessa", "Capilla Barco, Antonio", 
            "Caravella Castillo, Paula", "Carrasco Alberca, Eva María", "Carrero Ramos, Ainara", "Cerdán Arche, Carlos", 
            "Escribano Clemente, Víctor", "Fernández Martín, Mari Paz", "Fernández Reig, Dácil", "Frías Nebra, Silvia", 
            "Galera Carrillo, Francisco", "Gamero Corroto, María J.", "García Alejo, Arelis María", "García García, Irene", 
            "García Montesinos, Silvia", "García-Moreno L-M, Alfredo", "García-Junceda G de M, María Teresa", "Gil Larrazabal, Ana María", 
            "Gómez Arribas, María", "Gómez Calcerrada, Sergio", "González Muñoz, Rosa", "Gragera Sánchez, Fernando", 
            "Herrera del Monte, Gemma", "Herrera García, Fernando", "Holtsova Roberts, Svitlana", "Jardín Nieto, Rosa", 
            "Jiménez Mas-Guindal, Miguel", "Palomino García, José J.", "Karstens Morillas, Luisa", "Köwitz, Harald", 
            "Labajos González, Alexandra", "Lanchetas Sánchez-Guzmán, Francisco Javier", "Legaspi Yrimia, Ramón", "León Naranjo, Alicia", 
            "Lindez Trullo, Ana Belén", "López Castillo, María", "López Jiménez, Francisco", "López Molina, Luis", 
            "López-Gálvez R de A, Irene", "Luque Díaz, Ascensión", "Luna García, Xenia Patricia", "Maldonado Cuns, Ana María", 
            "Martín García-Ochoa, Beatriz", "Martín Tabarnero, Mari Paz", "Martínez Gascueña, Carlos", "Martínez Suárez, Susana", 
            "Melendo Moreno, Diego", "Montero Marcos, Esther", "Morales García, Mónica", "Morales Moya, Eduardo", 
            "Morera Moreno, Ana", "Moreno Martínez, Leonor", "Moreno Sánchez, Jorge", "Nomdedeu Fernández, Irene", 
            "Ondoño Cerda, Almudena", "Orejudo González, Elena", "Páramo Gonzalo, Sara", "Pascual Mangas, Ismael", 
            "Pastrana Jara, Mavi", "Pedraza Durán, Daniel", "Peña Romero, Álvaro", "Pernía Cue, Daniel", 
            "Pérez Morilla, María Sandra", "Pestaña Moral, Alicia", "Piedra Cobo, Miguel Ángel", "Pitarch Artola, Francisco", 
            "Ponce Gómez, Jaime", "Puyana Septién, Tomás", "Ramos Borox, M. Ángeles", "Requena Álvarez, Beatriz", 
            "Rivas Viota, Mónica", "Rodrigo Jiménez, Beatriz", "Rodríguez Quijano, Borja", "Romero León, Lourdes", 
            "Rovira Orozco, Estel", "Rubio Caballero, Daniel", "Ruiz Fernández, Nieves", "Ruiz Fernández, Rodrigo", 
            "Salamanca Bayón, Noelia", "San Felipe San C., Natalia", "Sánchez Calzada, David", "Sánchez Peña, Rocío", 
            "Santos Peláez, Eva", "Sanz Fernández, Daniel", "Saz Quintero, Raquel del", "Serrano Herrera, Alberto", 
            "Serrano López, Genoveva", "Sevilla Torres, Mar", "Simón Saiz, Guillermo", "Soler Gambin, Jesús", 
            "Sola Muñoz, Carmen", "Téllez Pérez, Rodrigo", "Tobaruela Riutort, Luis Fco.", "Tomás López, Carlota", 
            "Valle Martín-Consuegra, Cristina del", "Vallejo Ruiz, Isabel", "Valenzuela Campaña, Elena", "Varela Senra, Luisa", 
            "Vega Serrano, Beatriz", "Vela Carriazo, Mercedes", "Vera Revilla, María Isabel"
        ];

        const selectProfesor = document.getElementById('profesorSelect');
        profesores.sort().forEach(prof => {
            let opt = document.createElement('option');
            opt.value = prof;
            opt.textContent = prof;
            selectProfesor.appendChild(opt);
        });

        // Simulación de cruce con prioridades y horarios al seleccionar profesor
        selectProfesor.addEventListener('change', function() {
            const nombre = this.value;
            // Lógica basada en los documentos del centro (Cuadrante de huelga, servicios mínimos y horarios)
            // Comprobamos servicios mínimos oficiales del cuadrante de huelga:
            const serviciosMinimosOficiales = [
                "Alarcón García, Marta", "Bernaldo de Quirós, Marta", "Cabrera Porras, Antonio", 
                "Gragera Sánchez, Fernando", "Fernández Martín, M. de la Paz", "Jiménez Mas-Guindal, Miguel", 
                "Karstens Morillas, Luisa", "Köwitz, Harald", "Labajos González, Alexandra", 
                "León Naranjo, Alicia", "Pedraza Durán, Daniel", "Rivas Viota, Mónica", 
                "Rodrigo Jiménez, Beatriz", "Ruiz Fernández, Nieves", "Saz Quintero, Raquel del", "Varela Senra, Luisa"
            ];

            let situacion = "Imparte clase / Actividad normal en centro";
            let aula = "Consultar horario general aula";

            if (serviciosMinimosOficiales.some(p => nombre.includes(p.split(',')[0]))) {
                situacion = "Profesor designado para servicios mínimos";
                aula = "Guardia / Servicio Mínimo Asignado";
            }

            document.getElementById('aulaTeorica').value = aula;
            document.getElementById('situacionTeorica').value = situacion;
        });

        // Envío de datos (Integración con Google Sheets / Excel Cloud de EducaMadrid mediante WebApp de Apps Script)
        document.getElementById('formInspeccion').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const datosRegistro = {
                fechaHora: document.getElementById('fechaInsp').value + ' ' + document.getElementById('horaInsp').value,
                profesor: document.getElementById('profesorSelect').value,
                aula: document.getElementById('aulaReal').value,
                presencia: document.querySelector('input[name="presencia"]:checked').value,
                situacion: document.getElementById('situacionFinal').value
            };

            // NOTA: Para conectar con la hoja de cálculo de EducaMadrid, puedes desplegar un Google Apps Script 
            // y sustituir la URL de abajo por el endpoint de tu Web App.
            const WEB_APP_URL = "AQUÍ_PEGAS_TU_URL_DE_GOOGLE_APPS_SCRIPT_O_EXCEL_AUTOMATE";

            if(WEB_APP_URL.includes("AQUÍ")) {
                console.log("Datos listos para exportar a la hoja de cálculo:", datosRegistro);
                alert("¡Simulación de registro exitosa!\n\nPara volcarlo automáticamente a la hoja de cálculo de EducaMadrid, configure el endpoint de Apps Script en el código.");
                document.getElementById('mensajeExito').classList.remove('hidden');
                setTimeout(() => document.getElementById('mensajeExito').classList.add('hidden'), 5000);
                this.reset();
            } else {
                fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datosRegistro)
                }).then(() => {
                    document.getElementById('mensajeExito').classList.remove('hidden');
                    this.reset();
                }).catch(err => alert("Error al conectar con la hoja de cálculo: " + err));
            }
        });
    </script>
</body>
</html>
